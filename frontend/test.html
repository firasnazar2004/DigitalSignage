<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 5px;
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            padding: 12px 30px;
            background: transparent;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.2);
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-label {
            display: block;
            padding: 40px 20px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .file-upload-label:hover {
            background: #667eea;
            color: white;
        }

        .file-preview {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-preview-item {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .location-card {
            background: #f8f9ff;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .location-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .location-card.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .displays-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .display-card {
            background: #f8f9ff;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .display-card.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .display-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .display-uuid {
            font-size: 0.8rem;
            opacity: 0.7;
            font-family: monospace;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .alert {
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .override-section {
            background: #fff3cd;
            border: 2px solid #ffeaa7;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .override-warning {
            color: #856404;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .upload-progress {
            display: none;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e1e5e9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .step {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e1e5e9;
        }

        .step:last-child {
            border-bottom: none;
        }

        .step-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Digital Signage Management</h1>
            <p>Manage displays and upload media content</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('register')">Register Display</button>
            <button class="nav-tab" onclick="showTab('upload')">Upload Media</button>
        </div>

        <!-- Register Display Tab -->
        <div id="register-tab" class="tab-content active">
            <h2>Register New Display</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="display-name">Display Name</label>
                    <input type="text" id="display-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="display-mac">MAC Address</label>
                    <input type="text" id="display-mac" class="form-control" placeholder="AA:BB:CC:DD:EE:FF" required>
                </div>
                <div class="form-group">
                    <label for="display-location">Location</label>
                    <input type="text" id="display-location" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Register Display</button>
            </form>
            <div id="register-result"></div>
        </div>

        <!-- Upload Media Tab -->
        <div id="upload-tab" class="tab-content">
            <h2>Upload Media Content</h2>
            
            <div class="step">
                <div class="step-title">
                    <span class="step-number">1</span>
                    Select Media Files
                </div>
                <div class="form-group">
                    <div class="file-upload">
                        <input type="file" id="media-files" multiple accept="image/*,video/*">
                        <label for="media-files" class="file-upload-label">
                            <div>📁 Click to select media files or drag & drop</div>
                            <small>Supported: Images (JPEG, PNG, GIF, WebP, SVG) and Videos (MP4, WebM, OGG, AVI)</small>
                        </label>
                    </div>
                    <div id="file-preview" class="file-preview"></div>
                </div>
            </div>

            <div class="step">
                <div class="step-title">
                    <span class="step-number">2</span>
                    Select Location
                </div>
                <div id="locations-container">
                    <button type="button" id="load-locations" class="btn btn-secondary" onclick="loadLocations()">
                        Load Locations
                    </button>
                    <div id="locations-grid" class="locations-grid"></div>
                </div>
            </div>

            <div class="step">
                <div class="step-title">
                    <span class="step-number">3</span>
                    Select Displays
                </div>
                <div id="displays-container" style="display: none;">
                    <div id="displays-grid" class="displays-grid"></div>
                </div>
            </div>

            <div class="step">
                <div class="step-title">
                    <span class="step-number">4</span>
                    Upload Options
                </div>
                <div class="override-section">
                    <div class="override-warning">⚠️ Override Playlist Option</div>
                    <label>
                        <input type="checkbox" id="override-playlist" class="checkbox">
                        Replace existing playlist content with new media (this will remove all current content from selected displays)
                    </label>
                </div>
                <button type="button" id="upload-btn" class="btn btn-primary" onclick="uploadMedia()" disabled>
                    Upload Media
                </button>
            </div>

            <div class="upload-progress">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">Uploading...</div>
            </div>

            <div id="upload-result"></div>
        </div>
    </div>

    <script>
        // Global state
        let selectedLocation = null;
        let selectedDisplays = [];
        let selectedFiles = [];
        
        // API base URL - adjust this to match your backend
        const API_BASE = 'http://localhost:8000';

        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        // Display Registration
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('display-name').value,
                mac: document.getElementById('display-mac').value,
                location: document.getElementById('display-location').value
            };

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('register-result').innerHTML = `
                        <div class="alert alert-success">
                            <strong>Success!</strong> ${result.message}<br>
                            <strong>Display UUID:</strong> ${result.uuid}<br>
                            <strong>API Key:</strong> ${result.api_key}
                        </div>
                    `;
                    document.getElementById('register-form').reset();
                } else {
                    throw new Error(result.detail || 'Registration failed');
                }
            } catch (error) {
                document.getElementById('register-result').innerHTML = `
                    <div class="alert alert-error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        });

        // File selection handling
        document.getElementById('media-files').addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            updateFilePreview();
            updateUploadButton();
        });

        function updateFilePreview() {
            const preview = document.getElementById('file-preview');
            preview.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-preview-item';
                fileItem.innerHTML = `
                    <span>📄 ${file.name} (${formatFileSize(file.size)})</span>
                    <button type="button" onclick="removeFile(${index})" style="background: none; border: none; color: #dc3545; cursor: pointer;">✕</button>
                `;
                preview.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFilePreview();
            updateUploadButton();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Load locations
        async function loadLocations() {
            const button = document.getElementById('load-locations');
            const originalText = button.textContent;
            button.innerHTML = '<span class="loading"></span> Loading...';
            button.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/admin/locations`);
                const data = await response.json();
                
                if (response.ok) {
                    displayLocations(data.locations);
                } else {
                    throw new Error('Failed to load locations');
                }
            } catch (error) {
                alert('Error loading locations: ' + error.message);
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        function displayLocations(locations) {
            const grid = document.getElementById('locations-grid');
            grid.innerHTML = '';
            
            locations.forEach(location => {
                const locationCard = document.createElement('div');
                locationCard.className = 'location-card';
                locationCard.textContent = location;
                locationCard.onclick = () => selectLocation(location);
                grid.appendChild(locationCard);
            });
        }

        function selectLocation(location) {
            selectedLocation = location;
            selectedDisplays = [];
            
            // Update UI
            document.querySelectorAll('.location-card').forEach(card => {
                card.classList.remove('selected');
                if (card.textContent === location) {
                    card.classList.add('selected');
                }
            });
            
            loadDisplaysForLocation(location);
            updateUploadButton();
        }

        async function loadDisplaysForLocation(location) {
            try {
                const response = await fetch(`${API_BASE}/admin/display_by_location/${encodeURIComponent(location)}`);
                const data = await response.json();
                
                if (response.ok) {
                    displayDisplays(data.displays);
                    document.getElementById('displays-container').style.display = 'block';
                } else {
                    throw new Error('Failed to load displays');
                }
            } catch (error) {
                alert('Error loading displays: ' + error.message);
            }
        }

        function displayDisplays(displays) {
            const grid = document.getElementById('displays-grid');
            grid.innerHTML = '';
            
            displays.forEach(display => {
                const displayCard = document.createElement('div');
                displayCard.className = 'display-card';
                displayCard.innerHTML = `
                    <div class="display-header">
                        <div>
                            <div class="display-name">${display.name}</div>
                            <div class="display-uuid">${display.uuid}</div>
                        </div>
                        <input type="checkbox" class="checkbox" onchange="toggleDisplay('${display.uuid}', this.checked)">
                    </div>
                `;
                grid.appendChild(displayCard);
            });
        }

        function toggleDisplay(uuid, checked) {
            if (checked) {
                if (!selectedDisplays.includes(uuid)) {
                    selectedDisplays.push(uuid);
                }
            } else {
                selectedDisplays = selectedDisplays.filter(id => id !== uuid);
            }
            
            // Update display card styling
            document.querySelectorAll('.display-card').forEach(card => {
                const cardUuid = card.querySelector('.display-uuid').textContent;
                if (selectedDisplays.includes(cardUuid)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
            
            updateUploadButton();
        }

        function updateUploadButton() {
            const button = document.getElementById('upload-btn');
            const canUpload = selectedFiles.length > 0 && selectedDisplays.length > 0;
            button.disabled = !canUpload;
        }

        // Upload media
        async function uploadMedia() {
            if (selectedFiles.length === 0 || selectedDisplays.length === 0) {
                alert('Please select files and displays');
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });
            
            selectedDisplays.forEach(uuid => {
                formData.append('display_uuids', uuid);
            });
            
            const overridePlaylist = document.getElementById('override-playlist').checked;
            formData.append('override_playlist', overridePlaylist);

            // Show progress
            const progressContainer = document.querySelector('.upload-progress');
            const progressFill = document.querySelector('.progress-fill');
            const progressText = document.querySelector('.progress-text');
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';

            const uploadBtn = document.getElementById('upload-btn');
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="loading"></span> Uploading...';

            try {
                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressFill.style.width = percentComplete + '%';
                        progressText.textContent = `Uploading... ${Math.round(percentComplete)}%`;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const result = JSON.parse(xhr.responseText);
                        displayUploadResult(result);
                        resetUploadForm();
                    } else {
                        throw new Error(`Upload failed with status ${xhr.status}`);
                    }
                });

                xhr.addEventListener('error', () => {
                    throw new Error('Upload failed');
                });

                xhr.open('POST', `${API_BASE}/admin/upload_media`);
                xhr.send(formData);

            } catch (error) {
                document.getElementById('upload-result').innerHTML = `
                    <div class="alert alert-error">
                        <strong>Upload Error:</strong> ${error.message}
                    </div>
                `;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Media';
                progressContainer.style.display = 'none';
            }
        }

        function displayUploadResult(results) {
            const container = document.getElementById('upload-result');
            let html = '<div class="alert alert-success"><strong>Upload Successful!</strong><br>';
            
            results.forEach(result => {
                html += `
                    • ${result.message}<br>
                    &nbsp;&nbsp;Media ID: ${result.media_id}<br>
                    &nbsp;&nbsp;Type: ${result.media_type}, Size: ${formatFileSize(result.size)}<br>
                    &nbsp;&nbsp;Assigned to ${result.assigned_displays.length} display(s)<br>
                    &nbsp;&nbsp;Override Applied: ${result.override ? 'Yes' : 'No'}<br><br>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function resetUploadForm() {
            selectedFiles = [];
            selectedDisplays = [];
            selectedLocation = null;
            
            document.getElementById('media-files').value = '';
            document.getElementById('file-preview').innerHTML = '';
            document.getElementById('locations-grid').innerHTML = '';
            document.getElementById('displays-grid').innerHTML = '';
            document.getElementById('displays-container').style.display = 'none';
            document.getElementById('override-playlist').checked = false;
            document.getElementById('load-locations').style.display = 'inline-block';
            
            updateUploadButton();
        }
    </script>
</body>
</html>
