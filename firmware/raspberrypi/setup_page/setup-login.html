<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <title>Dhaher Setup</title>

    <style>
        .almarai-light {
            font-family: "Almarai", sans-serif;
            font-weight: 300;
            font-style: normal;
            }

        .almarai-regular {
            font-family: "Almarai", sans-serif;
            font-weight: 400;
            font-style: normal;
            }

        .almarai-bold {
            font-family: "Almarai", sans-serif;
            font-weight: 700;
            font-style: normal;
            }

        .almarai-extrabold {
            font-family: "Almarai", sans-serif;
            font-weight: 800;
            font-style: normal;
            }
        body{
            
            font-family: 'Almarai';

        }
        .main-wraper{
            
            background-color: #eaebee;

        }


        /* Header Section*/ 
        header {
            background: rgb(17,24,39) ;
            border-bottom: 1px solid var(--neutral-200);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            direction: rtl;
            height: 120px;
            width: 100%;
            border-radius: 10px;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        /* Logo Section */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-img {
            width: 280px;
            height: auto;
            object-fit: contain;
           
            box-shadow: var(--shadow-md);
        }
        /* Main Panel */
        .main-panel {
            background-color: rgb(255, 255, 255);
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--neutral-200);
            overflow: hidden;
            transition: all 0.3s ease;
            padding: 200px;
        }

        /* Forms Section */
        span{
            font-size: larger;
        }
        .forms-panel{
            
            background: rgb(236, 235, 235);
            border-radius: 15px;
            padding: 10px;
        
        }
        .forms-section{
            padding: 80px;
        }
        .loginArea{
            display:flexbox;
            align-items: center;
        }
        .forms-input{
            flex:1;
            padding:10px;
            border-radius: 7px;
            width: 100%;
            max-width: 400px;
        }
        .forms-entry{
            padding: 8px 0;
            display:flex; 
            align-items: center;
            margin-bottom: 12px;
            gap:12px;
        }
        .forms-entry span{
            min-width: 220px;
            text-align: right;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }

        /* Login  */
        .login-div{
            text-align: right;
        }




    </style>
</head>
<body>
    <div class="main-wrapper">
        <header class="header">
            <div class ="header-content">
                <div class = "logo-section">
                    <img src="/setup-static/assets/logo-white.svg" alt="Dhaher" class="logo-img">
                </div>
                
            </div>

        </header>
        <div id="access-message" style="padding: 10px; font-size: 1rem; color: #1e40af;"></div>
        <div class="main-panel">
            <h1>Sign In</h1>
             <div class="forms-panel">
                <div class="forms-section">
                    <form id="loginForm" class="loginArea">
                        <div class="form-group">
                            <label for="username">Account :<span class="required"></span></label>
                            <input type="text" id="username" name="username" required>
                        </div>

                    <div class="form-group">
                        <label for="password">Password :<span class="required"></span></label>
                            <input type="password" id="password" name="password" required>
                    </div>
                    <div class="login-btn">
                        <button type="submit" class="login-button" id="loginBtn" >
                        <div class="login-div">
                            <span>Login</span>
                        </div>
                    </button>
                    </div>
                    </form>
            </div>
        </div>       
        </div>
        
    </div>

    <script>
        function showMessage(message, type = 'error') {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
            } else {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
            }
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
            }, 5000);
        }
        const accessMessageDiv = document.getElementById('access-message');

async function getLocalIP() {
    try {
        const response = await fetch('/api/get-ip');
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        return data.ip;
    } catch (error) {
        accessMessageDiv.textContent = "Could not fetch local IP.";
        return null;
    }
}

getLocalIP().then(ip => {
    if (ip) {
        const port = window.location.port ? `:${window.location.port}` : '';
        accessMessageDiv.innerHTML = 
            `You can access this page at: 
             <a href="http://${ip}${port}/setup-login">
               http://${ip}${port}/setup-login
             </a>`;
    }
});

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const adminUsername = 'admin'
        const adminPassword = 'admin'
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        if (username !== adminUsername || password !== adminPassword) {
    showMessage('Incorrect Password', 'error');
    return;
} else {
    setTimeout(() => {
        window.location.href = '/setup.html';
    }, 850);
}
    })

    </script>
</body>
</html>
